<meta charset="utf-8">
<title>跳绳小挑战 · 可交互原型</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* ============================================================
     Body Park · 跳绳小挑战 可交互原型
     单文件、零依赖。手机端 / Atom 端 / 双端同屏 三种模式。
     ============================================================ */
  :root {
    --ink: #17191B;
    --ink-soft: #6B7370;
    --paper: #F5F6F5;
    --card: #FFFFFF;
    --accent: #23C766;
    --accent-deep: #16A353;
    --accent-soft: #E4F8EC;
    --mint: #23C766;
    --mint-soft: #E4F8EC;
    --gold: #1FA85B;
    --stage: #121514;       /* Atom 的深色舞台 */
    --stage-ink: #F2F4F2;
    --stage-soft: #8D9591;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--stage);
    color: var(--stage-ink);
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    overflow-x: hidden;
  }
  button { font-family: inherit; cursor: pointer; border: none; }
  .hidden { display: none !important; }

  /* ---------------- 原型控制条（页面底部，非产品 UI） ---------------- */
  #protobar {
    position: fixed;
    left: 50%; bottom: 10px; transform: translateX(-50%);
    z-index: 90;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center;
    background: rgba(16, 19, 17, 0.92);
    border: 1px solid #2B332E;
    border-radius: 999px;
    padding: 7px 12px;
    font-size: 12px;
    color: var(--stage-soft);
    backdrop-filter: blur(6px);
    max-width: calc(100vw - 16px);
  }
  #protobar .tag { color: var(--accent); font-weight: 700; letter-spacing: .08em; }
  #protobar button {
    background: #242C27; color: var(--stage-ink);
    border-radius: 999px; padding: 5px 11px; font-size: 12px;
  }
  #protobar button.on { background: var(--accent); color: #fff; }
  #protobar .sep { width: 1px; height: 16px; background: #2B332E; }
  #peers { color: var(--mint); }

  /* ---------------- 舞台布局 ---------------- */
  #stage {
    width: 100vw;
    height: 100vh;
    overflow: auto;              /* 2×/3× 放大超出视口时在舞台内滚动 */
    display: flex;
    gap: 28px;
    padding: 18px 14px 64px;
    flex-wrap: wrap;
  }
  #stage > * { margin: auto; }   /* 溢出时也能滚到边缘的安全居中 */
  body[data-mode="atom"] #stage { padding: 10px 10px 60px; }

  .milestone-toast {
    position: absolute; left: 50%; top: 34%; transform: translate(-50%,-50%) scale(.8);
    background: rgba(16,22,34,.85); color: #fff;
    border-radius: 16px; padding: 12px 22px;
    font-size: var(--t28); font-weight: 700; white-space: nowrap;
    opacity: 0; pointer-events: none; z-index: 5;
    transition: opacity .25s, transform .25s;
  }
  .milestone-toast.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  /* 格斗游戏式打击数字：大字砸入 → 压缩回弹 → 落定；金光闪于第 0 帧 */
  @keyframes cpunch {
    0%   { transform: scale(1.5) rotate(-2deg); filter: brightness(1.9); text-shadow: 0 0 .18em rgba(255,219,128,.95); }
    35%  { transform: scale(.9); filter: brightness(1.15); text-shadow: none; }
    70%  { transform: scale(1.05); }
    100% { transform: scale(1); filter: brightness(1); }
  }
  /* 里程碑重击版：更大砸入 + 横向震动 */
  @keyframes cpow {
    0%   { transform: scale(1.9) rotate(-4deg); filter: brightness(2.1); text-shadow: 0 0 .3em rgba(255,219,128,1); }
    25%  { transform: scale(.85) rotate(2deg) translateX(-.04em); filter: brightness(1.3); text-shadow: none; }
    45%  { transform: scale(1.15) translateX(.05em); }
    65%  { transform: scale(.96) translateX(-.03em); }
    100% { transform: scale(1); filter: brightness(1); }
  }

  /* ================= Atom 端（466×466 圆屏，按 466 设计稿等比缩放） ================= */
  #atomWrap { display: flex; flex-direction: column; align-items: center; gap: 10px; flex: none; }
  .atom-caption { font-size: 12px; color: var(--stage-soft); letter-spacing: .06em; }
  #atomRoot {
    --asz: 466px;   /* 物理分辨率 1:1；控制条可切 2×/3× 放大 */
    width: var(--asz); height: var(--asz);
    font-size: calc(var(--asz) / 466 * 16);   /* 1em ≈ 设计稿 16px */
    /* Atom 字号标准 6 档：18 / 22 / 24 / 28 / 32 / 36（见下方字阶注释） */
    --t18: calc(var(--asz) / 466 * 18);
    --t22: calc(var(--asz) / 466 * 22);
    --t24: calc(var(--asz) / 466 * 24);
    --t28: calc(var(--asz) / 466 * 28);
    --t32: calc(var(--asz) / 466 * 32);
    --t36: calc(var(--asz) / 466 * 36);
    /* 数字展示档（非文字，不占 6 档）：海报 40 / 卡片&结算 56 / 计数 96 / 倒计时 136 */
    --n40: calc(var(--asz) / 466 * 40);
    --n56: calc(var(--asz) / 466 * 56);
    --n96: calc(var(--asz) / 466 * 96);
    --n136: calc(var(--asz) / 466 * 136);
    background: var(--stage);
    border-radius: 50%;
    border: 10px solid #050707;
    outline: 3px solid #1D2420;
    box-shadow: 0 18px 60px rgba(0,0,0,.55);
    position: relative;
    overflow: hidden;
    flex: none;
  }
  .ascreen {
    position: absolute; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  .ascreen.show { display: flex; }
  .atom-bg { position: absolute; inset: 0; transition: background 1.2s; }
  /* ===== 统一字阶（466 设计稿，Atom 标准 6 档：18/22/24/28/32/36）=====
     18 微标注/角标（› 箭头、PB 徽章、海报小字）
     22 辅助提示（flip-hint、准备页提示、暂停副文案、海报评级）
     24 正文/列表/次按钮（记录行、设置行、榜单行、模式副文案、page-cta）
     28 主按钮/强调（Start、goal-chip、page-title、PB 行、星星行、toast）
     32 标题/状态（二级页标题、模式标题、准备状态、结算标签、暂停标题）
     36 庆祝（达成覆盖层）
     数字展示档（不占 6 档）: 海报 40 / 卡片&结算大数 56 / 计数 96 / 倒计时 136 */
  /* 单色 SVG 图标（替代 emoji） */
  .ico { width: 1em; height: 1em; vertical-align: -0.12em; fill: currentColor; }
  /* 边缘光：圆屏的"站位状态灯"（取代相机小窗） */
  #atomRoot .edge {
    position: absolute; inset: 0; border-radius: 50%; z-index: 6; pointer-events: none;
    transition: box-shadow .4s;
  }
  #atomRoot.waiting .edge { animation: edgepulse 1.5s ease-in-out infinite; }
  #atomRoot.presence .edge { box-shadow: inset 0 0 2.4em .3em rgba(35,199,102,.55); }
  @keyframes edgepulse {
    0%,100% { box-shadow: inset 0 0 2.4em .3em rgba(255,255,255,.35); }
    50%      { box-shadow: inset 0 0 1em 0 rgba(255,255,255,.08); }
  }

  /* 按钮可用性（466px @ ~326ppi，9mm 触控目标 ≈ 115px ≈ 7.2em）：
     主按钮做大做满，次按钮 ≥60px 且相互留出间距；
     按压反馈用直切（15fps 下 transition 无效）：缩放 + 提亮 */
  .atom-cta {
    z-index: 3;
    background: linear-gradient(180deg, var(--accent), var(--accent-deep));
    color: #fff; font-size: var(--t28); font-weight: 700;
    border-radius: 999px; padding: .6em 2em; min-width: 7em;
    box-shadow: 0 .3em 1.2em rgba(35,199,102,.4);
  }
  .atom-cta:active { transform: scale(.95); filter: brightness(1.15); }
  .a-goal-chip:active { transform: scale(.95); background: #242C27; }
  .a-goal-chip.dim { border-color: rgba(255,255,255,.22); color: var(--stage-soft); }
  #a-idle .atom-cta { min-width: 0; padding: .6em 1.6em; }
  #a-result .r-page:active { filter: brightness(1.08); }
  .a-history:active { filter: brightness(1.08); }

  /* Atom 待机（首页）：连胜/成就前置，设置贴边 */
  #a-idle { gap: .5em; z-index: 2; }
  .sub-tip { color: var(--stage-soft); font-size: var(--t24); }
  .idle-streak { font-size: var(--t32); font-weight: 700; }
  /* Quick Card 卡组 */
  .cards-viewport { position: absolute; inset: 0; overflow: hidden; touch-action: pan-y; }
  #a-cards { display: flex; width: 400%; height: 100%; transition: transform .25s; }
  .qcard {
    width: 25%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: .5em; text-align: center;
  }
  .card-big { font-size: var(--n56); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .qcard { position: relative; }
  .qcard.page { justify-content: flex-start; padding-top: 9.5%; gap: .7em; }
  .page-title { font-size: var(--t28); font-weight: 700; }
  .page-cta {
    position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%);
    background: transparent; color: var(--accent);
    border: 2px solid var(--accent); border-radius: 999px;
    padding: .42em 0; width: 56%;
    font-size: var(--t24); font-weight: 700;
  }
  .page-cta:active { transform: translateX(-50%) scale(.95); background: #12281B; }
  .pb-line {
    display: flex; align-items: center; gap: .7em;
    font-size: var(--t32); font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .pb-badge {
    background: #FFB020; color: #141614;
    font-size: var(--t18); font-weight: 800;
    border-radius: .3em; padding: .04em .3em;
  }
  .total-line { font-size: var(--t28); color: var(--stage-soft); font-variant-numeric: tabular-nums; }
  .total-line .st { color: var(--accent); font-weight: 700; }
  .board-foot-q { font-size: var(--t24); color: var(--accent); font-weight: 700; }
  /* Home 数据区块 = 可点击入口 */
  .home-block {
    background: none; border: none; color: inherit; font: inherit;
    display: flex; flex-direction: column; align-items: center; gap: .15em;
  }
  .home-block:active { filter: brightness(1.4); transform: scale(.97); }
  .home-block.pb-line { flex-direction: row; }
  .chev-s { color: var(--stage-soft); font-size: var(--t18); margin-left: .3em; }
  /* 翻页提示箭头（可点按翻页；未滑动过时脉动引导） */
  .pg-hint {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: none; border: none; z-index: 5;
    font-size: var(--t32); font-weight: 700; color: rgba(255,255,255,.4);
    padding: .3em .3em; cursor: pointer;
  }
  .pg-hint.left { left: 2%; }
  .pg-hint.right { right: 2%; }
  .pg-hint:active { color: var(--accent); }
  .pg-hint.pulse { animation: hintpulse 1.8s ease-in-out infinite; }
  @keyframes hintpulse { 50% { opacity: .3; } }
  .card-mid { font-size: var(--t32); font-weight: 700; }
  .qcard .h-list { gap: .35em; }
  .card-dots {
    position: absolute; bottom: 3.5%; left: 0; right: 0; z-index: 4;
    display: flex; justify-content: center; gap: .5em;
  }
  .cdot { width: .5em; height: .5em; border-radius: 50%; background: rgba(255,255,255,.22); }
  .cdot.on { background: var(--accent); width: 1em; border-radius: .3em; }
  /* 勋章 */
  .medal-row { display: flex; gap: .55em; font-size: var(--t32); }
  .medal-row .ico { width: 1.1em; height: 1.1em; }
  .medal-grid {
    display: grid; grid-template-columns: repeat(2, auto);
    gap: .7em 1.6em; font-size: var(--t24);
  }
  .medal-item { display: flex; align-items: center; gap: .4em; color: var(--stage-soft); }
  .medal-item.got { color: var(--accent); }
  .medal-item .ico { width: 1.2em; height: 1.2em; }
  .atom-cta.big { font-size: var(--t28); padding: .55em 1.7em; }
  .a-goal-chip.sm { font-size: var(--t24); padding: .4em .9em; }
  .bottom-row { align-items: center; gap: .6em; margin-top: .3em; }
  .round-btn {
    width: 2.7em; height: 2.7em; border-radius: 50%;
    background: #1B201D; border: 1.5px solid rgba(255,255,255,.25);
    color: var(--stage-soft); font-size: var(--t24);
    display: flex; align-items: center; justify-content: center;
    z-index: 3;
  }
  .round-btn:active { transform: scale(.92); background: #242C27; }
  .round-btn .ico { width: 1.15em; height: 1.15em; }

  /* 设置行 */
  .set-rows { display: flex; flex-direction: column; gap: .7em; width: 58%; }
  .srow {
    display: flex; align-items: center; justify-content: space-between;
    font-size: var(--t24); color: var(--stage-ink);
  }
  .srow .a-goal-chip.sm { font-size: var(--t24); min-width: 4.2em; }
  .srow .bval { font-size: var(--t32); font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }

  /* 模式选择页 */
  #a-mode { gap: .55em; z-index: 2; }
  .mode-title { font-size: var(--t32); font-weight: 700; }
  .mode-opt {
    width: 80%;
    background: #1B201D;
    border: 2px solid #2B332E;
    border-radius: 1em;
    padding: .5em .9em;
    display: flex; align-items: center; gap: .7em;
    color: var(--stage-ink); text-align: left;
  }
  .mode-ico {
    flex: none; font-size: var(--t32);
    width: 2em; height: 2em; border-radius: 50%;
    background: #12281B; color: var(--accent);
    display: flex; align-items: center; justify-content: center;
  }
  .mode-ico .ico { width: 1.15em; height: 1.15em; }
  .mode-txt { display: flex; flex-direction: column; gap: .1em; min-width: 0; text-align: left; }
  .mode-opt b { font-size: var(--t32); }
  .mode-txt > span { font-size: var(--t22); color: var(--stage-soft); white-space: nowrap; }
  .mode-opt:active { transform: scale(.96); border-color: var(--accent); filter: brightness(1.15); }
  .a-goal-chip {
    background: #1B201D; color: var(--accent);
    border: 1.5px solid var(--accent); border-radius: 999px;
    padding: .5em 1.1em; font-size: var(--t28); font-weight: 700;
    z-index: 3;
  }

  /* Atom 历史打卡记录（覆盖层） */
  .a-chip-row { display: flex; gap: .8em; z-index: 3; }
  .ghost-chip { border-color: rgba(255,255,255,.25); color: var(--stage-soft); background: transparent; }
  .a-history {
    position: absolute; inset: 0; z-index: 8;
    background: rgba(16,19,17,.97);
    display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: .8em; text-align: center;
  }
  .a-history.show { display: flex; }
  .a-history .h-title { font-size: var(--t32); font-weight: 700; }
  .h-list { display: flex; flex-direction: column; gap: .45em; }
  .hrow {
    display: flex; align-items: baseline; gap: .8em;
    font-size: var(--t24); font-variant-numeric: tabular-nums;
    color: var(--stage-ink);
  }
  .hrow .hd { color: var(--stage-soft); min-width: 3.2em; text-align: right; }
  .hrow .hd.done { color: var(--accent); }
  .hrow .hday { color: var(--stage-soft); min-width: 3.4em; }
  .hrow .hc { font-weight: 700; min-width: 3.4em; text-align: right; }
  .hrow .ht { color: var(--stage-soft); min-width: 2.8em; text-align: right; }
  .h-empty { font-size: var(--t24); color: var(--stage-soft); }
  /* 排行榜行 */
  .hrow .nm { min-width: 6.4em; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hrow.me-row { color: var(--accent); font-weight: 700; }
  .hrow.me-row .hd, .hrow.me-row .nm { color: var(--accent); }
  .bgap2 { color: var(--stage-soft); font-size: var(--t24); line-height: .6; }
  .today-btn { background: none; border: none; cursor: pointer; }
  .today-btn:active { filter: brightness(1.3); }

  /* Atom 待机：打卡周点（绿点=已打卡，描边=今天） */
  .a-week { display: flex; gap: .4em; z-index: 3; }
  .adot {
    width: .6em; height: .6em; border-radius: 50%;
    background: rgba(255,255,255,.14);
  }
  .adot.done { background: var(--accent); }
  .adot.today { box-shadow: 0 0 0 2px var(--accent); }

  /* Atom 准备：无取景器，靠边缘光 + 语音 */
  #a-ready { gap: .6em; z-index: 2; }
  #a-ready .status { font-size: var(--t32); font-weight: 700; max-width: 76%; line-height: 1.45; }
  #a-ready .hint { font-size: var(--t22); color: var(--stage-soft); }
  .countdown-big {
    font-size: var(--n136); font-weight: 800; line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  /* Atom 跳绳中：第一行计时(小字) → 第二行大数字+🌟目标倍数 → 下 3/5 纯火柴人 */
  #a-jump { z-index: 2; }
  #a-jump .ring-svg { position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%; }
  .a-timer {
    position: absolute; top: 4.6%; left: 0; right: 0; z-index: 3;
    text-align: center;
    font-size: var(--t24); color: var(--stage-soft); font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .a-timer.urgent { color: #FFB020; font-weight: 700; }   /* 测试最后 10 秒 */
  /* 计数区收进顶部 1/3（渲染视口缩至 2/3 后永久让出的区域） */
  #a-jump .a-top {
    position: absolute; top: 8%; left: 0; right: 0; height: 25%; z-index: 3;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .a-count-row { display: flex; align-items: flex-start; gap: .35em; }
  .a-count {
    font-size: var(--n96); font-weight: 800; line-height: 1;
    font-variant-numeric: tabular-nums;
    transition: transform .12s, color .3s;
  }
  .a-count.pop { animation: cpunch .26s linear; }
  .a-count.pow { animation: cpow .4s linear; }
  .a-count.over { color: #FFB020; }   /* 达标后计数转暖色，与火焰呼应 */
  .a-lapstars {
    color: var(--accent); font-size: var(--t28); font-weight: 700;
    letter-spacing: .05em; margin-top: .4em;
    font-variant-numeric: tabular-nums;
  }
  /* 跳绳中改为实时骨骼火柴人（canvas），Bono 陪跳位隐藏 */
  #a-jump .a-bono-slot { display: none; }
  .skel {
    position: absolute; inset: 0; width: 100%; height: 100%;
    z-index: 2; pointer-events: none;
    image-rendering: pixelated;   /* 放大时保持 466 真实像素 */
  }
  /* Bono 用 em 定尺寸，跟随圆屏等比缩放（留出贴边环的空隙，避免干涉） */
  #a-bono-jump svg { width: 15.5em; height: 15.5em; }
  #a-bono-idle svg { width: 5.5em; height: 5.5em; }
  #a-bono-result svg { width: 2.8em; height: 2.8em; }
  /* 火柴人线条颜色：深色屏白线，浅色屏黑线 */
  .bono { color: var(--ink); }
  #atomRoot .bono { color: var(--stage-ink); }

  /* Atom 结算：两页翻页（成绩 ⇄ 二维码），点按切换 */
  #a-result { z-index: 2; }
  #a-result .r-page {
    position: absolute; inset: 0; z-index: 3;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: .25em;
  }
  #a-result .num { font-size: var(--n56); font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; }
  #a-result .lab { font-size: var(--t32); font-weight: 700; }
  #a-result .earn { color: var(--gold); font-size: var(--t28); font-weight: 700; }
  #a-result .streak { color: var(--mint); font-size: var(--t24); }
  #a-result .unlock { color: #7FE3A8; font-size: var(--t24); font-weight: 600; max-width: 76%; }
  #a-result .unlock:empty, #a-result .streak:empty { display: none; }
  .flip-hint { color: var(--stage-soft); font-size: var(--t22); margin-top: .2em; }
  #a-r-page2 canvas { width: 6.5em; height: 6.5em; background: #fff; border-radius: .5em; padding: .3em; }
  /* 迷你成绩海报 */
  .poster {
    background: #fff; color: var(--ink);
    border-radius: .8em; padding: .5em 1.4em .6em;
    display: flex; flex-direction: column; align-items: center; gap: .1em;
  }
  .poster .p-num { font-size: var(--n40); font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .poster .p-sub { font-size: var(--t18); color: var(--ink-soft); }

  .poster .bono { color: var(--ink); }
  #a-poster-bono svg { width: 2.6em; height: 2.6em; }

  /* 漫画放射光背景（燃起来）：前 50 纯黑；每满 50 火焰升一级，暖橙黄色系 */
  .rays {
    position: absolute; inset: -50%;
    opacity: 0; transition: opacity 1s;
    pointer-events: none; z-index: 1;
  }
  .rays.on { opacity: 1; }
  .rays.f1 {   /* 一圈后：轻微的暖光芒 */
    background: repeating-conic-gradient(from 0deg,
      rgba(255,166,44,.10) 0deg 8deg, transparent 8deg 24deg);
    animation: rayspin 18s linear infinite;
  }
  .rays.f2 {   /* 两圈后：更亮更密 */
    background:
      repeating-conic-gradient(from 0deg,
        rgba(255,150,30,.20) 0deg 9deg,
        rgba(255,220,120,.06) 9deg 12deg,
        transparent 12deg 24deg);
    animation: rayspin 9s linear infinite;
  }
  .rays.f3 {   /* 三圈后：全面燃烧 + 底部火光 + 脉冲 */
    background:
      radial-gradient(60% 45% at 50% 100%, rgba(255,120,20,.28) 0%, transparent 70%),
      repeating-conic-gradient(from 0deg,
        rgba(255,140,20,.30) 0deg 10deg,
        rgba(255,230,140,.10) 10deg 14deg,
        transparent 14deg 24deg);
    animation: rayspin 5s linear infinite, raypulse 1.1s ease-in-out infinite;
  }
  @keyframes rayspin  { to { transform: rotate(360deg); } }
  @keyframes raypulse { 50% { opacity: .65; filter: brightness(1.4); } }
  @media (prefers-reduced-motion: reduce) {
    .rays.f1, .rays.f2, .rays.f3 { animation: none; }
  }

  /* ===== 刷新率模拟（10 / 13 / 15 fps，steps = 时长 × fps）=====
     连续动画量化为逐帧；过渡动画直切（低刷新率下 tween 无意义） */

  #atomRoot.fps10, #atomRoot.fps10 * { transition: none !important; }
  #atomRoot.fps10 .rays.f1 { animation: rayspin 18s steps(180) infinite; }
  #atomRoot.fps10 .rays.f2 { animation: rayspin 9s steps(90) infinite; }
  #atomRoot.fps10 .rays.f3 { animation: rayspin 5s steps(50) infinite, raypulse 1.06s steps(11) infinite; }
  #atomRoot.fps10 .bono.idle .body-g  { animation-timing-function: steps(26); }
  #atomRoot.fps10 .bono.hop .body-g   { animation-timing-function: steps(4); }
  #atomRoot.fps10 .bono.party .body-g { animation-timing-function: steps(8); }
  #atomRoot.fps10 .bono .rope         { animation-timing-function: steps(4); }
  #atomRoot.fps10.waiting .edge       { animation-timing-function: steps(15); }
  #atomRoot.fps10 .confetti-p         { animation-timing-function: steps(20); }
  #atomRoot.fps10 .celebrate .txt     { animation-timing-function: steps(5); }
  #atomRoot.fps10 .a-count.pop        { animation-timing-function: steps(3); }
  #atomRoot.fps10 .a-count.pow        { animation-timing-function: steps(4); }

  #atomRoot.fps13, #atomRoot.fps13 * { transition: none !important; }
  #atomRoot.fps13 .rays.f1 { animation: rayspin 18s steps(234) infinite; }
  #atomRoot.fps13 .rays.f2 { animation: rayspin 9s steps(117) infinite; }
  #atomRoot.fps13 .rays.f3 { animation: rayspin 5s steps(65) infinite, raypulse 1.06s steps(14) infinite; }
  #atomRoot.fps13 .bono.idle .body-g  { animation-timing-function: steps(34); }
  #atomRoot.fps13 .bono.hop .body-g   { animation-timing-function: steps(5); }
  #atomRoot.fps13 .bono.party .body-g { animation-timing-function: steps(10); }
  #atomRoot.fps13 .bono .rope         { animation-timing-function: steps(5); }
  #atomRoot.fps13.waiting .edge       { animation-timing-function: steps(20); }
  #atomRoot.fps13 .confetti-p         { animation-timing-function: steps(26); }
  #atomRoot.fps13 .celebrate .txt     { animation-timing-function: steps(6); }
  #atomRoot.fps13 .a-count.pop        { animation-timing-function: steps(3); }
  #atomRoot.fps13 .a-count.pow        { animation-timing-function: steps(5); }

  #atomRoot.fps15, #atomRoot.fps15 * { transition: none !important; }
  #atomRoot.fps15 .rays.f1 { animation: rayspin 18s steps(270) infinite; }
  #atomRoot.fps15 .rays.f2 { animation: rayspin 9s steps(135) infinite; }
  #atomRoot.fps15 .rays.f3 { animation: rayspin 5s steps(75) infinite, raypulse 1.06s steps(16) infinite; }
  #atomRoot.fps15 .bono.idle .body-g  { animation-timing-function: steps(39); }
  #atomRoot.fps15 .bono.hop .body-g   { animation-timing-function: steps(6); }
  #atomRoot.fps15 .bono.party .body-g { animation-timing-function: steps(12); }
  #atomRoot.fps15 .bono .rope         { animation-timing-function: steps(6); }

  /* ---------------- 吉祥物 Bono ---------------- */
  .bono { position: relative; flex: none; }
  .bono svg { display: block; }

let L = I18N[LANG];
function applyStatic() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = L[el.dataset.i18n];
    if (typeof v === 'string') el.textContent = v;
  });
  document.querySelectorAll('[data-i18n-html]').forEach(el => {
    const v = L[el.dataset.i18nHtml];
    if (typeof v === 'string') el.innerHTML = v;
  });
}
function setLang(l) {
  LANG = l === 'zh' ? 'zh' : 'en';
  L = I18N[LANG];
  try { localStorage.setItem(LANG_KEY, LANG); } catch (e) {}
  $('pb-en').classList.toggle('on', LANG === 'en');
  $('pb-zh').classList.toggle('on', LANG === 'zh');
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  pickVoice();
  applyStatic();
  renderSettings();
  bump();
}

/* ------------------------------------------------------------
   每日排行榜（原型为示意数据：按"日期+榜单"播种的确定性伪随机，
   每天稳定、双窗口一致；你的当日累计实时插入排名）
   ------------------------------------------------------------ */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function seedFrom(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
const G_A = ['Flying','Turbo','Mighty','Neon','Rocket','Shadow','Cosmic','Blazing','Lucky','Pixel'];
const G_B = ['Rope','Skipper','Jumper','Rabbit','Roo','Ninja','Comet','Spark','Hopper','Star'];
const L_A = ['绳王','跳跳','元气','闪电','弹簧','飞毛腿','早起','夜跳','快乐','隔壁'];
const L_B = ['阿强','小美','老王','丸子','同学','大侠','小鹿','阿宝','教练','萌新'];
function fakeBoard(scope) {
  const rand = mulberry32(seedFrom(todayKey() + scope));
  const n = scope === 'global' ? 40 : 18;
  const A = scope === 'global' ? G_A : L_A, B = scope === 'global' ? G_B : L_B;
  const seen = new Set(), list = [];
  while (list.length < n) {
    const nm = A[(rand() * A.length) | 0] + (scope === 'global' ? '_' : '') + B[(rand() * B.length) | 0];
    if (seen.has(nm)) continue;
    seen.add(nm);
    const base = scope === 'global' ? 2400 : 1100;
    list.push({ name: nm, count: Math.floor(60 + base * Math.pow(rand(), 2.6)) });
  }
  return list.sort((a, b) => b.count - a.count);
}
function todayCount() {
  const rec = profile.history[todayKey()];
  return (rec ? rec.count : 0) + (S.screen === 'jump' ? S.count : 0);
}
function myRank(scope) {
  const t = todayCount();
  return { rank: 1 + fakeBoard(scope).filter(u => u.count > t).length, count: t };
}
/* ------------------------------------------------------------
   每天来都不一样：全部由"今天的日期"决定，离线可算、双窗口一致。
   月相是真实计算；天气为示意（真实版接天气 API）；隐藏数字每天一换。
   ------------------------------------------------------------ */
function moonPhase() {
  const synodic = 29.53058867;
  const days = ((Date.now() / 86400000 - 10957.27) % synodic + synodic) % synodic;
  return ['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘'][Math.floor(days / synodic * 8 + 0.5) % 8];
}
const AMBIENCE = ['晴', '多云', '舒适', '小雨', '微风'];
/* 问候/开场白正文在 I18N（L.greets / L.openings），这里只抽当日索引 */
const dailySeed = mulberry32(seedFrom('daily' + todayKey()));
const daily = {
  moon: moonPhase(),
  amb: AMBIENCE[(dailySeed() * AMBIENCE.length) | 0],
  greetI: (dailySeed() * 6) | 0,
  openingI: (dailySeed() * 4) | 0,
  lucky: 55 + ((dailySeed() * 45) | 0),          /* 每日隐藏数字 55–99，踩中有惊喜 */
  sceneOffset: seedFrom(todayKey()) % SCENES.length, /* 今日主打场景轮换 */
};

   ============================================================ */
let AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur, type, gainV, when) {
  const ac = audio(); if (!ac) return;
  const t = ac.currentTime + (when || 0);
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(gainV || 0.12, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
/* 确认音：五声音阶循环（C D E G A），永远和谐悦耳；叠一层八度泛音增加"叮"的亮度 */
const PENTA = [523.25, 587.33, 659.25, 783.99, 880.0];
const sndJump = (n) => {
  const f = PENTA[n % PENTA.length];
  tone(f, 0.13, 'sine', 0.12);
  tone(f * 2, 0.10, 'sine', 0.045);
};
const sndBeep = () => tone(520, 0.12, 'sine', 0.14);
const sndGo   = () => tone(880, 0.25, 'sine', 0.16);
const sndMilestone = () => { tone(523,0.12,'sine',0.12); tone(659,0.12,'sine',0.12,0.10); tone(784,0.2,'sine',0.12,0.20); };
const sndStar = () => { tone(1047,0.1,'sine',0.1); tone(1319,0.18,'sine',0.1,0.08); };
const sndFanfare = () => { [523,659,784,1047].forEach((f,i)=>tone(f,0.3,'triangle',0.13,i*0.13)); };

/* AI 教练语音（原型用系统 TTS；真实版接 TTS 服务定制音色，方案见设计文档） */
let voiceOn = true;
let voiceSel = null;
function pickVoice() {
  try {
    const vs = speechSynthesis.getVoices();
    /* 优先挑明亮的女声（各系统命名不同，按常见名模糊匹配），兜底该语言任意音色 */
    voiceSel = LANG === 'zh'
      ? (vs.find(v => /^zh/i.test(v.lang) && /Xiaoxiao|Yunxi|Ting|Mei|Sin-ji|Hui|Yao|Google/i.test(v.name))
         || vs.find(v => /^zh/i.test(v.lang)) || null)
      : (vs.find(v => /^en/i.test(v.lang) && /Aria|Jenny|Samantha|Zira|Google US English/i.test(v.name))
         || vs.find(v => /^en/i.test(v.lang)) || null);
  } catch (e) {}
}
try { speechSynthesis.onvoiceschanged = pickVoice; pickVoice(); } catch (e) {}
function speak(text) {
  if (!voiceOn) return;
  try {
    if (!window.speechSynthesis) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = LANG === 'zh' ? 'zh-CN' : 'en-US'; u.rate = 1.08; u.pitch = 1.08;
    if (voiceSel) u.voice = voiceSel;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ============================================================
   渲染
   ============================================================ */
function showScreens() {
  ['launch','idle','mode','ready','jump','result'].forEach(s => {
    const a = $('a-' + s);
    if (a) a.classList.toggle('show', S.screen === s || (S.screen === 'celebrate' && s === 'jump'));
  });
  $('a-celebrate').classList.toggle('show', S.screen === 'celebrate');
  $('a-pause').classList.toggle('show', S.paused && S.screen === 'jump');
}

let lastRenderedScreen = null;
let lastRenderedOutfit = null;
function render() {
  showScreens();
  /* 远端换了装扮 → 本端重绘 Bono */
  if (lastRenderedOutfit !== profile.outfit) { lastRenderedOutfit = profile.outfit; refreshBonos(); }

  /* 首页 / 待机 */
  /* 模式选择页：两个选择框的副标随设置更新 */
  $('a-opt-timed-sub').textContent = L.timedSub(S.testMin, profile.bests[S.testMin] || 0);
  $('a-opt-free-sub').textContent = L.freeSub(profile.goalNum, todayCount());

  /* 跳绳中（达标后数字转暖色，继续往上数；副标行改为计时） */
  $('a-count').textContent = S.count;
  $('a-count').classList.toggle('over', S.goalHit);

  const inJump = S.screen === 'jump' || S.screen === 'celebrate';

  /* 圆环：一圈 = 一个目标（自由跳时一圈 = 50），跳满即清零、从头再画；
     🌟 = 目标倍数，显示在大数字旁边 */
  const unit = S.goal > 0 ? S.goal : 50;
  const lap = Math.floor(S.count / unit), lapPct = (S.count % unit) / unit;
  if (S.goal === TEST && inJump) {
    /* 测试模式：环 = 剩余时间（随 ticker 持续消退） */
    const timePct = Math.min(1, sessionElapsed() / testMs());
    $('a-ring-arc').style.strokeDashoffset = 1420.0 * timePct;
  } else {
    $('a-ring-arc').style.strokeDashoffset = 1420.0 * (1 - lapPct);
  }
  /* 每跳满 50 就多点一颗星 */
  $('a-lapstars').textContent = fmtStars(lap);

  /* 燃起来分级：前 50 纯黑背景；每满 50 火焰升一级（暖橙色），3 级封顶 */
  const fire = Math.min(lap, 3);
  const rayCls = 'rays' + (inJump && fire > 0 ? ' on f' + fire : '');
  $('a-rays').className = rayCls;

  /* 课中计时（第一行，小字）；测试模式显示剩余时间 */
  const rawMs = S.goal === TEST ? Math.max(0, testMs() - sessionElapsed()) : sessionElapsed();
  $('a-timer').textContent = inJump ? fmtTime(rawMs) : '';
  $('a-timer').classList.toggle('urgent',
    inJump && S.goal === TEST && testMs() - sessionElapsed() <= 10000);

  /* Atom 入口卡 / 首页卡组刷新 */
  if (S.screen === 'idle' || S.screen === 'launch') renderQuickCards();

  /* 背景：跳绳中用纯黑舞台（给火焰让路）；待机/首页展示"今日主打场景"（每天轮换） */
  const unlockedN = Math.max(1, Math.min(profile.scenes, SCENES.length));
  const scene = SCENES[(S.bgStep + daily.sceneOffset) % unlockedN];
  $('atomBg').style.background = inJump ? '#0A0C0B' : scene.atom;

  /* 边缘光状态灯：准备中白灰呼吸，锁定/跳绳中绿色 */
  $('atomRoot').classList.toggle('waiting', S.screen === 'ready' && S.countdown === 0);
  $('atomRoot').classList.toggle('presence', S.countdown > 0 || (S.screen === 'jump' && !S.paused));

  /* 倒计时 */
  const cdOn = S.countdown > 0;
  $('a-cd').classList.toggle('hidden', !cdOn);
  if (cdOn) $('a-cd').textContent = S.countdown;
  $('a-ready-tip').classList.toggle('hidden', cdOn);

  /* 刚进入结算页 → Atom 翻页复位到成绩页 */
  if (S.screen === 'result' && lastRenderedScreen !== 'result') {
    $('a-r-page1').classList.remove('hidden');
    $('a-r-page2').classList.add('hidden');
  }
  lastRenderedScreen = S.screen;

  /* 结算页（全部从状态推导，双窗口联动时跟随端同样正确） */
  if (S.screen === 'result') {
    const goalMet = S.goal > 0 && S.count >= S.goal;
    const ageDisp = profile.age === '成人' ? L.adult : profile.age;
    $('a-r-num').textContent = S.count;
    if (S.goal === TEST) {
        $('a-r-lab').textContent = S.newBest ? L.newRec : L.timeUp;
    } else {
        $('a-r-lab').textContent = (goalMet ? L.goalReached : L.roundOver) + ' · ' + fmtTime(S.elapsedMs);
    }
    /* 体测评级（仅 1 分钟测试） + 卡路里 */
    $('a-r-rate').textContent = (S.goal === TEST && S.testMin === 1)
      ? L.rateLine(rateTest(S.count), ageDisp) : '';
    const kcal = sessionKcal();
    $('a-r-earn').innerHTML =
      `${ico('star', '#1FA85B')} +${S.earned} · ${ico('clock')} ${fmtTime(S.elapsedMs)}` +
      (kcal > 0 ? ` · ${kcal.toFixed(1)} ${L.kcal}` : '');
    /* 分享页迷你海报 */
    $('a-poster-num').textContent = S.count;
    $('a-poster-sub').textContent = `${todayKey().slice(5).replace('-', '.')} · ` +
      (S.goal === TEST ? L.minTest(S.testMin) : S.goal === 0 ? L.freeJump : L.goalOf(S.goal));
    $('a-poster-rate').textContent = S.goal === TEST && S.testMin === 1
      ? L.rated(rateTest(S.count)) : (goalMet ? L.dailyMet : '');
    $('a-r-streak').innerHTML = `${ico('flame', '#FFB020')} ${L.streakLine(profile.streak)}`;
    $('a-r-unlock').innerHTML = S.unlock ? `${ico('gift', '#7FE3A8')} ${S.unlock}` : '';
    const rg = myRank('global');
    $('a-r-rank').innerHTML = `${ico('trophy')} ${L.globalRank(rg.rank)}` +
      (S.goal === TEST ? L.minBest(S.testMin, profile.bests[S.testMin] || 0) : '');
    drawQR($('a-qr'));
  }

  /* 姿态 */
  if (S.screen === 'celebrate' || S.screen === 'result') setBonoPose('party');
  else if (S.screen !== 'jump') setBonoPose('idle');
}

/* ============================================================

function popCount(strong) {
  ['a-count'].forEach(id => {
    const el = $(id);
    el.classList.remove('pop', 'pow'); void el.offsetWidth;
    el.classList.add(strong ? 'pow' : 'pop');
  });
}
function toast(msg, ms) {
  ['a-toast'].forEach(id => {
    const el = $(id); el.textContent = msg; el.classList.add('show');
    clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), ms || 1400);
  });
}
function confetti(rootEl, n) {
  const colors = ['#23C766','#7FE3A8','#FFFFFF','#BFC6C2','#16A353'];
  for (let i = 0; i < n; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-p';
    p.style.left = Math.random() * 100 + '%';
    p.style.background = colors[i % colors.length];
    p.style.animationDuration = (1.6 + Math.random() * 1.4) + 's';
    p.style.animationDelay = (Math.random() * 0.4) + 's';
    rootEl.appendChild(p);
    setTimeout(() => p.remove(), 3600);
  }
}
function flyStar(rootEl) {
  const s = document.createElement('div');
  s.className = 'fly-star'; s.textContent = '★'; s.style.color = '#1FA85B';
  s.style.left = '50%'; s.style.top = '45%';
  rootEl.appendChild(s);
  requestAnimationFrame(() => {
    s.style.transform = 'translate(120px,-160px) scale(.5)';
    s.style.opacity = '0';
  });
  setTimeout(() => s.remove(), 1100);
}

/* ============================================================
   核心动作（所有 mutation 都走这里，便于同步）
   ============================================================ */
let cdTimer = null;

function setGoal(g) { S.goal = g; profile.goal = g; saveProfile(); bump(); }

function openMode() {
  if (S.screen !== 'idle' && S.screen !== 'result') return;
  S.screen = 'mode';
  speak(L.spMode);
  bump();
}
function startSession(g) {
  if (S.screen !== 'idle' && S.screen !== 'result' && S.screen !== 'mode') return;
  if (g !== undefined) { S.goal = g; profile.goal = g; saveProfile(); }
  S.screen = 'ready'; S.count = 0; S.earned = 0; S.bgStep = 0; S.paused = false;
  S.goalHit = false; S.totalAtStart = profile.total; S.unlock = '';
  S.elapsedMs = 0; S.runSince = null; S.newBest = false;
  testMark30 = false; testMark10 = false;
  liveRank = 1 + GB.filter(u => u.count > todayCount()).length;   /* 记录起跳时的名次 */
  speak(S.goal === TEST ? L.spTest(S.testMin) : L.spStart(L.openings[daily.openingI]));
  bump();
}

function standLocked() {              /* 站进框稳定 → 开始倒计时 */
  if (S.screen !== 'ready' || S.countdown > 0) return;
  S.countdown = 3; bump();
  sndBeep(); speak(L.cd[0]);
  clearInterval(cdTimer);
  cdTimer = setInterval(() => {
    S.countdown--;
    if (S.countdown > 0) { sndBeep(); speak(S.countdown === 2 ? L.cd[1] : L.cd[2]); }
    else {
      clearInterval(cdTimer);
      S.screen = 'jump';
      S.elapsedMs = 0; S.runSince = Date.now();
      sndGo(); speak(L.cd[3]);
    }
    bump();
  }, 900);
}

/* 一圈 = 50 下；跳满一圈点亮一颗星 */
const fmtStars = (lap) => lap <= 0 ? '' : (lap <= 4 ? '★'.repeat(lap) : `★×${lap}`);

/* 课中计时 */
const fmtTime = (ms) => {
  const s = Math.floor(ms / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
};
const sessionElapsed = () => S.elapsedMs + (S.runSince ? Date.now() - S.runSince : 0);
const testMs = () => (S.testMin || 1) * 60000;
let testMark30 = false, testMark10 = false;
setInterval(() => {
  if (S.screen !== 'jump' || S.paused || !S.runSince) return;
  if (S.goal === TEST) {
    /* 1 分钟测试：读秒倒计时 + 节点语音 + 时间到自动结算 */
    const rem = testMs() - sessionElapsed();
    if (rem <= 0) { endSession(); return; }
    $('a-timer').textContent = fmtTime(rem);
    $('a-timer').classList.toggle('urgent', rem <= 10000);
    $('a-ring-arc').style.strokeDashoffset = 1420.0 * (sessionElapsed() / testMs());
    if (rem <= 30000 && !testMark30) { testMark30 = true; speak(L.sp30); }
    if (rem <= 10000 && !testMark10) { testMark10 = true; speak(L.sp10); }
  } else {
    $('a-timer').textContent = fmtTime(sessionElapsed());
  }
}, 250);

/* 加油语在 I18N：L.cheers（随语言切换） */

/* ------------------------------------------------------------
   青少年体测评级（1 分钟测试）：按年龄段分档
   ⚠️ 示意阈值——上线前替换为《国家学生体质健康标准》官方分表（按年级×性别）
   ------------------------------------------------------------ */
const AGES = ['6-8', '9-11', '12-14', '15-17', '成人'];
const RATING = {                     /* [及格, 良好, 优秀, 满分] */
  '6-8':   [60, 90, 110, 130],
  '9-11':  [80, 110, 130, 150],
  '12-14': [100, 130, 150, 170],
  '15-17': [110, 140, 160, 180],
  '成人':  [90, 120, 140, 160],
};
function rateTest(count) {
  const t = RATING[profile.age] || RATING['9-11'];
  const i = count >= t[3] ? 4 : count >= t[2] ? 3 : count >= t[1] ? 2 : count >= t[0] ? 1 : 0;
  return L.ratings[i];
}

/* ------------------------------------------------------------
   卡路里估算（MET 法，运动纲要标准值）：
   跳频 <100/分 → MET 8.8；100–120 → 11.8；>120 → 12.3
   kcal = MET × 体重(kg) × 活动小时数（用停表后的净跳绳时长，暂停不计）
   接手表后可升级为心率法（Keytel 公式），复杂度二期再上
   ------------------------------------------------------------ */
function sessionKcal() {
  const min = S.elapsedMs / 60000;
  if (min <= 0 || S.count <= 0) return 0;
  const freq = S.count / min;
  const met = freq < 100 ? 8.8 : freq <= 120 ? 11.8 : 12.3;
  return met * (profile.weight || 40) * (S.elapsedMs / 3600000);
}

/* 实时排名爬升反馈：每超过一位对手就即时告知（全球榜，前 15 名内） */
const GB = fakeBoard('global');
let liveRank = Infinity;
function checkOvertake() {
  const tNow = todayCount();
  const rk = 1 + GB.filter(u => u.count > tNow).length;
  if (rk < liveRank) {
    if (rk <= 15 && liveRank !== Infinity) {
      const below = GB.find(u => u.count <= tNow);
      if (below) toast(L.passToast(below.name, rk), 1300);
      if (rk === 3) speak(L.spTop3);
      if (rk === 1) speak(L.spTop1);
    }
    liveRank = rk;
  }
}
function registerJump() {
  if (S.screen !== 'jump' || S.paused) return;
  S.count++;
  profile.total++;
  sndJump(S.count);
  popCount(S.count % 10 === 0);   /* 逢十用重击版动画 */
  bonoHopOnce();
  spawnRipple();

  /* 惊喜机制 */
  if (S.count % 10 === 0) {
    S.bgStep++;
    sndMilestone();
    const cheer = () => L.cheers[Math.floor(Math.random() * L.cheers.length)];
    let msg = L.tenToast(S.count, cheer());
    if (S.count % 20 === 0) {
      let gain = 2;
      if (Math.random() < 0.15) { gain = 4; msg = L.doubleToast(gain); confetti($('atomRoot'), 24); }
      else msg = L.starsToast(S.count, gain);
      S.earned += gain;
      sndStar(); flyStar($('atomRoot'));
    }
    const unit = S.goal > 0 ? S.goal : 50;
    if (S.count % unit === 0) {
      msg = L.lapToast(S.count / unit);
      sndStar();
    }
    toast(msg);
    /* 教练语音分层：满一个目标倍数报"点亮一颗星"，整 30 带一句鼓励，其余整 10 只报数 */
    if (!(S.goal > 0 && S.count === S.goal)) {
      if (S.count % unit === 0) speak(L.spLap(S.count, S.count / unit));
      else if (S.count % 30 === 0) speak(L.spTen(S.count, cheer()));
      else speak(String(S.count));
    }
  }

  checkOvertake();

  /* 每日隐藏数字：踩中有惊喜 */
  if (S.count === daily.lucky) {
    S.earned += 5;
    profile.luckyHits = (profile.luckyHits || 0) + 1;
    sndStar();
    confetti($('atomRoot'), 30);
    toast(L.luckyToast(daily.lucky), 1800);
    speak(L.spLucky(daily.lucky));
  }

  /* 达标：不打断、不切界面，庆祝完继续往上数（51、52……用户不停就一直跳） */
  if (S.goal > 0 && S.count === S.goal && !S.goalHit) {
    S.goalHit = true;
    S.earned += 10;
    sndFanfare();
    confetti($('atomRoot'), 50);
    toast(L.goalToast(S.goal), 1800);
    speak(L.spGoal);
  }
  bump();
}

/* 结算只在用户"真的停下"时发生：离开画面 5 秒 / 点结束 / 自动演示收尾 */
function endSession() {
  if (S.screen !== 'jump') return;
  const goalMet = S.goalHit;
  if (S.runSince) { S.elapsedMs += Date.now() - S.runSince; S.runSince = null; }
  S.paused = false; clearTimeout(pauseEndTimer);
  /* 限时测试：按时长（1'/2'）分别记录历史最佳 */
  if (S.goal === TEST) {
    S.newBest = S.count > (profile.bests[S.testMin] || 0);
    if (S.newBest) {
      profile.bests[S.testMin] = S.count;
      if (S.testMin === 1) profile.bestMinute = S.count;
    }
  }
  /* 庆祝页：达标或破纪录都值得一场全屏庆祝 */
  const celebrated = goalMet || (S.goal === TEST && S.newBest);
  if (celebrated) {
    $('a-celebrate').querySelector('.txt').textContent =
      S.goal === TEST && S.newBest ? L.newRec : L.celeGoal;
    S.screen = 'celebrate';
    bump();
    sndFanfare();
    confetti($('atomRoot'), 70);
  }
  if (S.goal === TEST) {
    const rateTxt = S.testMin === 1 ? rateTest(S.count) : '';
    speak(S.newBest ? L.spTestBest(S.count, rateTxt) : L.spTestEnd(S.testMin, S.count, rateTxt));
  } else {
    speak(goalMet ? L.spEndGood(S.count) : L.spEnd);
  }

  /* 打卡与档案结算 */
  const tk = todayKey();
  const rec = profile.history[tk] || { count: 0, done: false, ms: 0 };
  rec.count += S.count;
  rec.ms = (rec.ms || 0) + S.elapsedMs;
  const met = goalMet || rec.count >= 50;
  if (met && !rec.done) {
    rec.done = true;
    if (profile.lastDone === dayKeyOffset(-1)) profile.streak += 1;
    else if (profile.lastDone !== tk) profile.streak = 1;
    profile.lastDone = tk;
  }
  profile.history[tk] = rec;
  profile.stars += S.earned;
  if (S.count > (profile.bestSession || 0)) profile.bestSession = S.count;   /* 单轮 PB */

  /* 解锁判定（借鉴 JRC：达标解锁场景，累计解锁装扮） */
  const unlocks = [];
  if (goalMet && profile.scenes < SCENES.length) {
    profile.scenes++;
    unlocks.push(L.sceneTag(sName(SCENES[profile.scenes - 1])));
  }
  OUTFITS.forEach(o => {
    if (o.at > 0 && o.at > S.totalAtStart && o.at <= profile.total)
      unlocks.push(L.outfitTag(oName(o)));
  });
  S.unlock = unlocks.length ? L.unlockLine(unlocks) : '';
  if (unlocks.length) speak(L.spUnlock(unlocks));
  saveProfile();

  if (celebrated) setTimeout(() => { S.screen = 'result'; bump(); }, 1900);
  else { S.screen = 'result'; bump(); }
}

let pauseEndTimer = null;

  }
  bump();
}

/* 伪二维码占位（示意图形，非真实二维码） */
function drawQR(cv) {
  const ctx = cv.getContext('2d'); const n = 12, cell = cv.width / n;
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = '#17191B';
  let seed = 7;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    seed = (seed * 73 + x * 31 + y * 17) % 97;
    if (seed % 2 === 0) ctx.fillRect(x * cell, y * cell, cell - 1, cell - 1);
  }
  [[0,0],[n-4,0],[0,n-4]].forEach(([x,y]) => {
    ctx.fillStyle = '#17191B'; ctx.fillRect(x*cell, y*cell, cell*4, cell*4);
    ctx.fillStyle = '#fff'; ctx.fillRect((x+1)*cell, (y+1)*cell, cell*2, cell*2);
    ctx.fillStyle = '#17191B'; ctx.fillRect((x+1.5)*cell, (y+1.5)*cell, cell, cell);
  });
}

/* ============================================================
   实时骨骼火柴人渲染（466×466 @ 15fps）

   AI 团队对接口：window.AtomSkeleton.feed(pts)
   - pts: 33 个关键点数组 [{x, y, v?}, ...]，MediaPipe Pose 拓扑
     （0 鼻 / 7,8 耳 / 11,12 肩 / 13,14 肘 / 15,16 腕 /
       23,24 髋 / 25,26 膝 / 27,28 踝）
   - 坐标归一化 0–1，原点左上，请在喂入前完成镜像
   - 建议喂入频率 ≥15Hz；500ms 无数据自动切回内置模拟
   - 计数管线独立（registerJump），骨骼只负责渲染与触地动效
   ============================================================ */
const skel = { ctx: null, pts: null, lastFeed: 0, ripples: [], dirty: false };
window.AtomSkeleton = {
  feed(pts) { skel.pts = pts; skel.lastFeed = performance.now(); },
};
/* 触地涟漪：只在"判定计数落地"时触发（registerJump 调用），一次一个椭圆环。
   0 帧最强，0.5s 内半径增大、线宽与不透明度衰减到消失 */
/* ------------------------------------------------------------
   虚拟跳绳：相位振荡器驱动
   - 转速 = 实测跳频（跳跃间隔 EMA），无计数时用默认 2.3 转/秒并缓慢衰减
   - 每次"判定计数落地"把相位向 π/2（绳过脚下）软校正 40% —— 与计数严格同拍
   - 前后遮挡：绳在下半周画在人前、上半周画在人后；过侧面时近乎直线并降透明度
   - 低帧率适配：按当帧角速度拖 3 条残影弧（1.0/0.4/0.18 透明度）
   ------------------------------------------------------------ */
function syncRope(now) {
  if (skel.lastJumpT) {
    const ivl = now - skel.lastJumpT;
    if (ivl > 200 && ivl < 1500) skel.jumpIvl = (skel.jumpIvl || 435) * 0.6 + ivl * 0.4;
  }
  skel.lastJumpT = now;
  skel.ropeOmega = 2 * Math.PI * 1000 / (skel.jumpIvl || 435);
  const target = Math.PI / 2;
  let d = target - (skel.ropePhase % (2 * Math.PI));
  while (d > Math.PI) d -= 2 * Math.PI;
  while (d < -Math.PI) d += 2 * Math.PI;
  skel.ropePhase += d * 0.4;
}
function ropeGhosts(pts, ws, dt) {
  const L = pts[15], R = pts[16];
  if (!L || !R) return [];
  const X = (q) => q.x * 466, Y = (q) => q.y * 466;
  const wym = (Y(L) + Y(R)) / 2;
  const footY = Math.max(pts[27] ? Y(pts[27]) : wym + 120, pts[28] ? Y(pts[28]) : wym + 120);
  const headTop = pts[7] && pts[8]
    ? (Y(pts[7]) + Y(pts[8])) / 2 - 43 * ws : wym - 120;
  const Rlow = (footY + 34 * ws) - wym;      /* 谷底：过脚下大弧度（宽松感） */
  const Rhigh = wym - (headTop - 30 * ws);   /* 顶点：过头顶大弧度 */
  /* 活跃度：只在"正在跳"时显示 —— 距上次计数 1.2s 内全显，之后 0.7s 内淡出 */
  const act = skel.lastJumpT
    ? Math.max(0, Math.min(1, 1 - ((performance.now() - skel.lastJumpT) - 1200) / 700)) : 0;
  if (act <= 0.02) return [];
  const step = Math.max(0.25, skel.ropeOmega * dt * 0.55);
  const out = [];
  for (let i = 0; i < 3; i++) {
    const sn = Math.sin(skel.ropePhase - i * step);
    const sag = sn >= 0 ? sn * Rlow : sn * Rhigh;
    out.push({
      front: sn >= 0,
      alpha: [0.85, 0.4, 0.18][i] * (Math.abs(sn) < 0.18 ? 0.5 : 1) * act,
      w: (sn >= 0 ? 4.5 : 3.2) * ws * [1, 0.85, 0.7][i],
      lx: X(L), ly: Y(L), rx: X(R), ry: Y(R),
      cx: (X(L) + X(R)) / 2, cy: wym + 2 * sag,
    });
  }
  return out;
}
function drawRopeSet(c, set, front) {
  for (const g of set) {
    if (g.front !== front) continue;
    c.strokeStyle = `rgba(48,232,120,${g.alpha})`;   /* 翠绿 */
    c.lineWidth = g.w;
    c.lineCap = 'round';
    c.beginPath();
    c.moveTo(g.lx, g.ly);
    c.quadraticCurveTo(g.cx, g.cy, g.rx, g.ry);
    c.stroke();
  }
}

function spawnRipple() {
  if (!skel.ctx) return;
  syncRope(performance.now());
  const pts = skel.rpts;
  const la = pts && pts[27], ra = pts && pts[28];
  const x = la && ra ? (la.x + ra.x) / 2 * 466 : 233;
  const y = la && ra ? (Math.max(la.y, ra.y) + 0.02) * 466 : 466 * 0.88;
  skel.ripples.push({ x, y, s: skel.ws || 1, t0: performance.now() });
}
/* 内置模拟：连续跳绳动作（腾空 62% + 落地屈膝缓冲 + 手腕摆绳） */
function simPose(now) {
  const t = now / 1000, f = 2.3;
  const ph = (t * f) % 1;
  const air = ph < 0.62 ? Math.sin(Math.PI * ph / 0.62) : 0;
  const crouch = ph >= 0.62 ? 0.018 * Math.sin(Math.PI * (ph - 0.62) / 0.38) : 0;
  const dy = -0.055 * air + crouch;
  const swing = Math.sin(2 * Math.PI * t * f) * 0.012;
  const P = [];
  const set = (i, x, y) => { P[i] = { x, y, v: 1 }; };
  set(0, 0.5, 0.47 + dy);
  set(7, 0.465, 0.475 + dy); set(8, 0.535, 0.475 + dy);
  set(11, 0.435, 0.545 + dy); set(12, 0.565, 0.545 + dy);
  set(13, 0.385, 0.615 + dy); set(14, 0.615, 0.615 + dy);
  set(15, 0.36 + swing, 0.665 + dy * 0.7); set(16, 0.64 - swing, 0.665 + dy * 0.7);
  set(23, 0.462, 0.665 + dy); set(24, 0.538, 0.665 + dy);
  set(25, 0.455, 0.775 + dy * 0.75 + crouch); set(26, 0.545, 0.775 + dy * 0.75 + crouch);
  set(27, 0.45, 0.878 + dy * 0.5); set(28, 0.55, 0.878 + dy * 0.5);
  /* 随机漫游（多正弦叠加的平滑漂移）：远近缩放 ±26%、左右 ±13%、高低 ±4%
     —— 演示固定视口下火柴人大小与位置的真实变化 */
  const d = 1 + 0.26 * Math.sin(t * 0.55 + 1.3) * Math.sin(t * 0.13 + 0.4);
  const ox = 0.09 * Math.sin(t * 0.31 + 0.7) + 0.04 * Math.sin(t * 0.09);
  const oy = 0.04 * Math.sin(t * 0.22 + 2.1);
  return P.map(p => p && { x: 0.5 + (p.x - 0.5) * d + ox, y: 0.878 + (p.y - 0.878) * d + oy, v: 1 });
}
/* 渲染视口：整个相机帧固定缩至 2/3，底边居中锚定 —— 顶部 1/3 永久让给数字。
   骨骼在帧内的真实位置关系原样保留（不播相机画面，只按此比例渲染火柴人）。
   帧坐标 (x,y) → 屏幕：x' = 0.5 + (x-0.5)×⅔；y' = 0.94 - (1-y)×⅔
   （底边锚在 0.94 而非 1.0，双脚与贴边计数环保持安全间距） */
const VIEW_S = 2 / 3;
function toStage(pts) {
  return pts.map(p => p && {
    x: 0.5 + (p.x - 0.5) * VIEW_S,
    y: 0.94 - (1 - p.y) * VIEW_S,
    v: p.v,
  });
}

function skelFrame() {
  const c = skel.ctx; if (!c) return;
  const active = S.screen === 'jump' || S.screen === 'celebrate';
  if (!active) {
    if (skel.dirty) { c.clearRect(0, 0, 466, 466); skel.dirty = false; skel.ripples = []; }
    return;
  }
  const now = performance.now();
  const pts = toStage((now - skel.lastFeed < 500 && skel.pts) ? skel.pts : simPose(now));
  skel.rpts = pts;
  skel.dirty = true;
  c.clearRect(0, 0, 466, 466);
  /* 绳相位推进（1.3s 无计数则转速缓慢衰减到待机感） */
  const dt = skel.lastFrameT ? (now - skel.lastFrameT) / 1000 : 1 / 15;
  skel.lastFrameT = now;
  if (!skel.ropeOmega) skel.ropeOmega = 2 * Math.PI * 2.3;
  if (!skel.lastJumpT || now - skel.lastJumpT > 1300) skel.ropeOmega *= 0.985;
  skel.ropePhase = (skel.ropePhase || 0) + skel.ropeOmega * dt;
  const X = (p) => p.x * 466, Y = (p) => p.y * 466;
  /* 线宽随人物远近缩放：以肩宽为尺（基准 40px），远小近大 */
  const span = pts[11] && pts[12]
    ? Math.hypot(X(pts[12]) - X(pts[11]), Y(pts[12]) - Y(pts[11])) : 40;
  const ws = Math.max(0.55, Math.min(1.5, span / 40));
  skel.ws = ws;
  const rope = ropeGhosts(pts, ws, dt);
  drawRopeSet(c, rope, false);            /* 上半周：绳在身后 */
  /* 粗壮 pictogram 风格：浅白身体 + 纯白头/手/脚，远距离可读 */
  c.lineCap = 'round'; c.lineJoin = 'round';
  c.strokeStyle = '#EDF2EF';
  const seg = (a, b, w) => {
    if (!pts[a] || !pts[b]) return;
    c.lineWidth = w * ws;
    c.beginPath(); c.moveTo(X(pts[a]), Y(pts[a])); c.lineTo(X(pts[b]), Y(pts[b])); c.stroke();
  };
  /* 躯干：等宽直柱（颈点→髋中点），经典火柴人式直上直下，无宽肩无梯形 */
  c.fillStyle = '#EDF2EF';
  let neck = null;
  if (pts[11] && pts[12] && pts[23] && pts[24]) {
    neck = { x: (X(pts[11]) + X(pts[12])) / 2, y: (Y(pts[11]) + Y(pts[12])) / 2 };
    c.lineWidth = 26 * ws;
    c.beginPath();
    c.moveTo(neck.x, neck.y);
    c.lineTo((X(pts[23]) + X(pts[24])) / 2, (Y(pts[23]) + Y(pts[24])) / 2);
    c.stroke();
  }
  /* 手臂：从颈点分出（火柴人式）；腿：从真实髋点下来（髋点在柱体宽度内，侧边仍直） */
  const armSeg = (elbow, wrist) => {
    if (!neck || !pts[elbow]) return;
    c.lineWidth = 18 * ws;
    c.beginPath(); c.moveTo(neck.x, neck.y); c.lineTo(X(pts[elbow]), Y(pts[elbow])); c.stroke();
    seg(elbow, wrist, 18);
  };
  armSeg(13, 15); armSeg(14, 16);
  seg(23, 25, 20); seg(25, 27, 20); seg(24, 26, 20); seg(26, 28, 20);
  /* 手部 / 脚部小圆头（纯白，略亮于肢体） */
  c.fillStyle = '#FFFFFF';
  const knob = (i, r) => {
    if (!pts[i]) return;
    c.beginPath(); c.arc(X(pts[i]), Y(pts[i]), r * ws, 0, Math.PI * 2); c.fill();
  };
  knob(15, 13); knob(16, 13);
  knob(27, 14); knob(28, 14);
  /* 头：纯白实心圆，与肩部留出 pictogram 式间隙 */
  if (pts[7] && pts[8]) {
    c.fillStyle = '#FFFFFF';
    c.beginPath();
    c.arc((X(pts[7]) + X(pts[8])) / 2, (Y(pts[7]) + Y(pts[8])) / 2 - 17 * ws, 26 * ws, 0, Math.PI * 2);
    c.fill();
  }

  drawRopeSet(c, rope, true);             /* 下半周：绳在身前（过脚下） */

  /* 涟漪：与计数动画同一套"打击语法"（0.7s 生命周期）
     0 帧起始圈 36 → 爆发式扩张(easeOutCubic) → 缓滑到 173
     环宽压缩-回弹(9 → 2.5 → 4 → 1, 对应数字的 squash/rebound)
     落点金色闪光占前 22% 生命周期(对应数字的金闪) */
  skel.ripples = skel.ripples.filter(rp => now - rp.t0 < 700);
  skel.ripples.forEach(rp => {
    const age = (now - rp.t0) / 700;
    const sc = rp.s || 1;
    /* 落点闪光：金色实心椭圆，急速淡出 */
    if (age < 0.22) {
      const f = age / 0.22;
      c.fillStyle = `rgba(255,219,128,${0.5 * (1 - f)})`;
      const fr = (34 + 42 * f) * sc;
      c.beginPath();
      c.ellipse(rp.x, rp.y, fr, fr * 0.3, 0, 0, Math.PI * 2);
      c.fill();
    }
    const p = 1 - Math.pow(1 - age, 3);          /* 爆发式扩张 */
    const rx = (36 + 137 * p) * sc;
    const k = Math.min(1, age / 0.4);            /* 金 → 白 */
    const cr = Math.round(255 + (242 - 255) * k);
    const cg = Math.round(219 + (244 - 219) * k);
    const cb = Math.round(128 + (242 - 128) * k);
    c.strokeStyle = `rgba(${cr},${cg},${cb},${0.95 * (1 - age)})`;
    c.lineWidth = age < 0.35 ? 9 - 6.5 * (age / 0.35)          /* 砸入后急压 */
                : age < 0.7 ? 2.5 + 1.5 * ((age - 0.35) / 0.35) /* 小回弹 */
                : 4 - 3 * ((age - 0.7) / 0.3);                  /* 收尾变细 */
    c.beginPath();
    c.ellipse(rp.x, rp.y, rx, rx * 0.3, 0, 0, Math.PI * 2);
    c.stroke();
  });
}
let skelTimer = setInterval(skelFrame, 66);   /* 帧率随 setFps 联动 */

/* 换装：手机左右箭头（JRC 同款交互），Atom 待机点 Bono 循环 */
$('a-bono-idle').addEventListener('click', () => { audio(); cycleOutfit(1); });
/* ------------------------------------------------------------
   排行榜独立模块（Atom）：Top3 + 你的邻近区间 + 超越目标提示
   核心原则：永远给"再跳几下就能超过谁"的可爬升感
   ------------------------------------------------------------ */
let aBoardScope = 'global';
function renderABoard() {
  const list = fakeBoard(aBoardScope);
  const me = myRank(aBoardScope);
  const merged = list.map(u => ({ name: u.name, count: u.count, me: false }));
  merged.push({ name: L.you, count: me.count, me: true });
  merged.sort((a, b) => b.count - a.count || (a.me ? -1 : 1));
  const meIdx = merged.findIndex(u => u.me);

  const row = (i, u) =>
    `<div class="hrow${u.me ? ' me-row' : ''}">` +
    `<span class="hd${i < 3 ? ' done' : ''}">${i + 1}</span>` +
    `<span class="nm">${u.name}</span>` +
    `<span class="hc">${u.count}</span></div>`;
  const rows = [];
  merged.slice(0, 3).forEach((u, i) => rows.push(row(i, u)));
  if (meIdx > 4) rows.push('<div class="bgap2">···</div>');
  for (let i = Math.max(3, meIdx - 1); i <= Math.min(merged.length - 1, meIdx + 1); i++) {
    rows.push(row(i, merged[i]));
  }
  $('a-board-list').innerHTML = rows.join('');

  const above = meIdx > 0 ? merged[meIdx - 1] : null;
  $('a-board-foot').textContent = !above ? L.first
    : L.passFoot(above.count - me.count + 1, above.name);
  const pct = Math.round((1 - meIdx / merged.length) * 100);
  $('a-board-sub').textContent =
    L.boardSub(pct, aBoardScope === 'global' ? L.scopeUserG : L.scopeUserL);
  $('ab-global').classList.toggle('dim', aBoardScope !== 'global');
  $('ab-local').classList.toggle('dim', aBoardScope !== 'local');
}
$('a-board').addEventListener('click', () => $('a-board').classList.remove('show'));

/* ------------------------------------------------------------
   首页 Quick Cards：滑动切换 [封面][主卡][排行榜][记录]
   ------------------------------------------------------------ */
let cardIdx = 0, swiped = false, swX = null;
const CARD_N = 4;
function setCard(i) {
  cardIdx = Math.max(0, Math.min(CARD_N - 1, i));
  $('a-cards').style.transform = `translateX(-${cardIdx * 100 / CARD_N}%)`;
  document.querySelectorAll('.cdot').forEach((d, j) => d.classList.toggle('on', j === cardIdx));
  $('a-hint-l').style.visibility = cardIdx > 0 ? 'visible' : 'hidden';
  $('a-hint-r').style.visibility = cardIdx < CARD_N - 1 ? 'visible' : 'hidden';
}

/* ---- 翻页引导：未滑动过时右箭头脉动 + 进入首页时卡片"探头"一下 ---- */
let userSwiped = false;
function swipeLearned() {
  if (userSwiped) return;
  userSwiped = true;
  $('a-hint-r').classList.remove('pulse');
}
function nudge() {
  if (userSwiped || cardIdx !== 0 || S.screen !== 'idle') return;
  const seq = [-3, -6, -7.5, -6, -3, 0];   /* 单页宽度的 % */
  let k = 0;
  const iv = setInterval(() => {
    if (userSwiped || cardIdx !== 0) { clearInterval(iv); return; }
    $('a-cards').style.transform = `translateX(${seq[k] / CARD_N}%)`;
    if (++k >= seq.length) clearInterval(iv);
  }, 80);
}

/* 勋章体系：全部由现有数据计算得出 */
const maxDaily = () => Math.max(0, ...Object.values(profile.history).map(r => r.count || 0));
const MEDALS = [
  { name: '连胜 7 天',   en: '7-day streak',     cond: () => profile.streak >= 7 },
  { name: '连胜 21 天',  en: '21-day streak',    cond: () => profile.streak >= 21 },
  { name: '累计 1000',   en: 'Total 1,000',      cond: () => profile.total >= 1000 },
  { name: '累计 10000',  en: 'Total 10,000',     cond: () => profile.total >= 10000 },
  { name: "1 分钟 120",  en: "120 in 1'",        cond: () => (profile.bests[1] || 0) >= 120 },
  { name: '单轮 200',    en: '200 in a round',   cond: () => (profile.bestSession || 0) >= 200 },
  { name: '单日 300',    en: '300 in a day',     cond: () => maxDaily() >= 300 },
  { name: '猎中隐藏数字', en: 'Lucky number hit', cond: () => (profile.luckyHits || 0) > 0 },
];

function renderQuickCards() {
  /* 系统入口卡 */
  $('a-launch-streak').textContent = L.launchStreak(profile.streak);
  /* Page 1 · Home */
  $('a-card-streak').textContent = profile.streak;
  $('a-card-today').innerHTML = `${L.today(todayCount())}<span class="chev-s">›</span>`;
  $('a-card-pb').innerHTML =
    `<span class="pb-badge">PB</span> ${profile.bestSession || '—'}` +
    `<span>· ${profile.bests[1] || '—'} / 1'</span><span class="chev-s">›</span>`;
  $('a-card-total').innerHTML =
    `${L.total} ${profile.total} <span class="st">★${profile.stars}</span><span class="chev-s">›</span>`;
  /* Page 2 · 打卡记录：周点 + 最近 3 天 */
  const wk = $('a-week'); wk.innerHTML = '';
  for (let i = -6; i <= 0; i++) {
    const rec = profile.history[dayKeyOffset(i)];
    const dot = document.createElement('span');
    dot.className = 'adot' + (rec && rec.done ? ' done' : '') + (i === 0 ? ' today' : '');
    wk.appendChild(dot);
  }
  const keys = Object.keys(profile.history).filter(k => profile.history[k].count > 0).sort();
  const dayNo = {}; keys.forEach((k, i) => { dayNo[k] = i + 1; });
  $('a-qrec').innerHTML = keys.length
    ? keys.slice(-3).reverse().map(k => {
        const r = profile.history[k];
        return `<div class="hrow"><span class="hd${r.done ? ' done' : ''}">${k.slice(5).replace('-', '/')}</span>` +
          `<span class="hday">Day ${dayNo[k]}</span><span class="hc">${L.cnt(r.count)}</span>` +
          `<span class="ht">${r.ms ? fmtTime(r.ms) : '—'}</span></div>`;
      }).join('')
    : `<div class="h-empty">${L.noRecQ}</div>`;
  /* Page 3 · 全球排行：Top3 + 你 */
  const list = fakeBoard('global');
  const me = myRank('global');
  const merged = list.map(u => ({ name: u.name, count: u.count, me: false }));
  merged.push({ name: L.you, count: me.count, me: true });
  merged.sort((a, b) => b.count - a.count || (a.me ? -1 : 1));
  const meIdx = merged.findIndex(u => u.me);
  const row = (i, u) =>
    `<div class="hrow${u.me ? ' me-row' : ''}"><span class="hd${i < 3 ? ' done' : ''}">${i + 1}</span>` +
    `<span class="nm">${u.name}</span><span class="hc">${u.count}</span></div>`;
  const rows = merged.slice(0, 3).map((u, i) => row(i, u));
  if (meIdx > 2) rows.push(row(meIdx, merged[meIdx]));
  $('a-qboard').innerHTML = rows.join('');
  const above = meIdx > 0 ? merged[meIdx - 1] : null;
  $('a-qboard-foot').textContent = above
    ? L.passFoot(above.count - me.count + 1, above.name) : L.first;
  /* Page 4 · 我的成就 */
  const got = MEDALS.filter(m => m.cond());
  $('qc3-medals').innerHTML = MEDALS.slice(0, 6)
    .map(m => `<span style="color:${m.cond() ? 'var(--accent)' : 'rgba(255,255,255,.18)'}">${ico('medal')}</span>`)
    .join('');
  $('qc3-star').innerHTML = L.achvLine(got.length, MEDALS.length, ico('star', '#1FA85B'), profile.stars);
}
function renderBest() {
  const rows = [[L.bestRound, profile.bestSession], [L.best1, profile.bests[1]],
                [L.best2, profile.bests[2]], [L.bestDay, maxDaily()]];
  $('a-best-rows').innerHTML = rows.map(([lab, v]) =>
    `<div class="srow"><span>${lab}</span><b class="bval">${v || '—'}</b></div>`).join('');
}
function renderMedals() {
  $('a-medal-grid').innerHTML = MEDALS.map(m =>
    `<div class="medal-item${m.cond() ? ' got' : ''}">${ico('medal')}<span>${mName(m)}</span></div>`
  ).join('');
}

$('a-dots').innerHTML = '<span class="cdot"></span>'.repeat(CARD_N);
setCard(0);
$('a-cards-vp').addEventListener('pointerdown', (e) => { swX = e.clientX; });
$('a-cards-vp').addEventListener('pointerup', (e) => {
  if (swX === null) return;
  const dx = e.clientX - swX; swX = null;
  if (Math.abs(dx) > 40) {
    swiped = true;
    swipeLearned();
    setCard(cardIdx + (dx < 0 ? 1 : -1));
    setTimeout(() => { swiped = false; }, 80);
  }
});
/* 系统入口卡 → 进入 APP */
$('a-launch').addEventListener('click', () => {
  audio(); S.screen = 'idle'; bump(); speak(L.greets[daily.greetI]);
  setTimeout(nudge, 900);
  setTimeout(nudge, 10000);
});
/* Home 区域入口：数字区块点击直达对应二级页 */
$('a-go-rec').addEventListener('click', () => {
  if (swiped) return; audio(); renderHistory(); $('a-history').classList.add('show');
});
$('a-card-today').addEventListener('click', () => {
  if (swiped) return; audio(); renderABoard(); $('a-board').classList.add('show');
});
$('a-card-pb').addEventListener('click', () => {
  if (swiped) return; audio(); renderBest(); $('a-best').classList.add('show');
});
$('a-best').addEventListener('click', () => $('a-best').classList.remove('show'));
$('a-card-total').addEventListener('click', () => {
  if (swiped) return; audio(); renderMedals(); $('a-medal').classList.add('show');
});
/* 翻页箭头可点按 */
$('a-hint-l').addEventListener('click', () => { audio(); swipeLearned(); setCard(cardIdx - 1); });
$('a-hint-r').addEventListener('click', () => { audio(); swipeLearned(); setCard(cardIdx + 1); });
$('a-hint-r').classList.add('pulse');

/* 各页底部胶囊 → 二级页面 */
$('qc-rec-go').addEventListener('click', () => {
  if (swiped) return; audio(); renderHistory(); $('a-history').classList.add('show');
});
$('qc-board-go').addEventListener('click', () => {
  if (swiped) return; audio(); renderABoard(); $('a-board').classList.add('show');
});
$('qc-achv-go').addEventListener('click', () => {
  if (swiped) return; audio(); renderMedals(); $('a-medal').classList.add('show');
});
$('a-medal').addEventListener('click', () => $('a-medal').classList.remove('show'));
['ab-global', 'ab-local'].forEach(id => $(id).addEventListener('click', (e) => {
  e.stopPropagation(); audio();
  aBoardScope = id === 'ab-global' ? 'global' : 'local';
  renderABoard();
}));

/* 历史打卡记录（Atom）：日期 · Day x · 次数 · 用时 */
function renderHistory() {
  const keys = Object.keys(profile.history)
    .filter(k => profile.history[k].count > 0).sort();
  const dayNo = {};
  keys.forEach((k, i) => { dayNo[k] = i + 1; });
  const list = $('a-history-list');
  if (!keys.length) {
    list.innerHTML = `<div class="h-empty">${L.noRecH}</div>`;
    return;
  }
  list.innerHTML = keys.slice(-6).reverse().map(k => {
    const r = profile.history[k];
    return `<div class="hrow">` +
      `<span class="hd${r.done ? ' done' : ''}">${k.slice(5).replace('-', '/')}</span>` +
      `<span class="hday">Day ${dayNo[k]}</span>` +
      `<span class="hc">${L.cnt(r.count)}</span>` +
      `<span class="ht">${r.ms ? fmtTime(r.ms) : '—'}</span>` +
      `</div>`;
  }).join('');
}
$('a-history-btn').addEventListener('click', (e) => {
  e.stopPropagation(); audio(); renderHistory(); $('a-history').classList.add('show');
});
$('a-history').addEventListener('click', () => $('a-history').classList.remove('show'));

document.querySelectorAll('[data-act="end"]').forEach(b => b.addEventListener('click', () => endSession()));
document.querySelectorAll('[data-act="home"]').forEach(b => b.addEventListener('click', goHome));
document.querySelectorAll('[data-act="again"]').forEach(b => b.addEventListener('click', () => { audio(); startSession(); }));
document.querySelectorAll('[data-act="resume"]').forEach(b => b.addEventListener('click', () => pauseSession(false)));

$('pb-auto').addEventListener('click', () => { audio(); setAuto(!autoTimer); });
$('pb-cam').addEventListener('click', () => { audio(); setCam(!cam.on); });
$('pb-voice').addEventListener('click', () => {
  voiceOn = !voiceOn;
  $('pb-voice').classList.toggle('on', voiceOn);
  if (!voiceOn) { try { speechSynthesis.cancel(); } catch (e) {} }
});

/* 刷新率三档（真机波动范围）：10 / 13 / 15 fps */
let curFps = 15, curScale = 1;
function caption() {
  document.querySelector('.atom-caption').textContent =
    `Atom · 466×466 圆屏 · ${curFps}fps · ${curScale}×`;
}
function setFps(n) {
  curFps = n;
  [10, 13, 15].forEach(k => {
    $('atomRoot').classList.toggle('fps' + k, k === n);
    $('pb-f' + k).classList.toggle('on', k === n);
  });
  clearInterval(skelTimer);
  skelTimer = setInterval(skelFrame, Math.round(1000 / n));
  caption();
}
[10, 13, 15].forEach(k => $('pb-f' + k).addEventListener('click', () => setFps(k)));
/* 屏幕缩放：466 物理分辨率 1× / 2× / 3× */
function setScale(n) {
  curScale = n;
  $('atomRoot').style.setProperty('--asz', (466 * n) + 'px');
  [1, 2, 3].forEach(k => $('pb-s' + k).classList.toggle('on', k === n));
  caption();
}
[1, 2, 3].forEach(k => $('pb-s' + k).addEventListener('click', () => setScale(k)));

/* ============================================================
   启动
   ============================================================ */
let MODE = null;
function enter(mode) {
  MODE = mode;
  document.body.dataset.mode = mode;
  $('stage').classList.remove('hidden');
  $('protobar').classList.remove('hidden');
  render();
}

mountBono('a-bono-idle', 100, 'idle');
mountBono('a-bono-jump', 60, 'idle');
mountBono('a-bono-result', 64, 'party');
mountBono('a-poster-bono', 42, 'party');

skel.ctx = $('a-skel').getContext('2d');
render();
$('a-history-btn').innerHTML = ico('list') + ' 记录';
$('a-settings-btn').innerHTML = ico('gear');
document.querySelectorAll('.mode-ico').forEach(el => { el.innerHTML = ico(el.dataset.ico); });
$('pb-en').addEventListener('click', () => setLang('en'));
$('pb-zh').addEventListener('click', () => setLang('zh'));
setLang(LANG);   /* 应用语言（默认 EN；?lang=zh 或控制条切换） */
setFps(15);   /* 默认 15fps（真机波动时可切 13/10 检查动效） */
/* 手机小屏：自动缩放贴合（桌面仍默认 466 物理 1:1，可用 1×/2×/3× 切换） */
if (Math.min(window.innerWidth, window.innerHeight) < 520) {
  $('atomRoot').style.setProperty('--asz', '92vmin');
  document.querySelector('.atom-caption').textContent = 'Atom · 466×466 圆屏 · 手机适配';
}

enter('atom');
